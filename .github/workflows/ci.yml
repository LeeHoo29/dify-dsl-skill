name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix skills/dify-dsl
      - run: python -m unittest discover -s tests -v
      - run: >-
          python skills/dify-dsl/scripts/sync_code_nodes.py
          skills/dify-dsl/examples/managed-code-workflow.yml
          --source-root skills/dify-dsl/examples/code-nodes
      - run: node skills/dify-dsl/scripts/layout_dify_dsl.mjs skills/dify-dsl/examples/*.yml --check

  upstream-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: langgenius/dify
          ref: 1.17.1
          path: .tmp/dify
          sparse-checkout: |
            api/tests/fixtures/workflow
            api/services/rag_pipeline/transform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_dify_fixtures.py .tmp/dify --target-version 0.7.0
